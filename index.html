<title>Manusis Mobile (Demo Educacional)</title>
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:#d8d8d8;color:#333}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:#f2f2f2;position:relative;box-shadow:0 0 24px rgba(0,0,0,.25);padding-bottom:64px}
.header{background:#F37021;color:#fff;display:flex;align-items:center;min-height:54px;padding:8px 10px;position:sticky;top:0;z-index:50}
.header .icon-btn{background:none;border:none;color:#fff;font-size:21px;padding:8px 9px;cursor:pointer;line-height:1}
.header h1{font-size:16.5px;font-weight:600;margin-left:10px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header img.logo{height:26px;flex:1;object-fit:contain;object-position:left;margin-left:10px}
.offline-badge{font-size:10px;background:#fff;color:#e53935;border-radius:4px;padding:2px 6px;font-weight:700;margin-right:4px}
.queue-badge{font-size:10px;background:#1e88e5;color:#fff;border-radius:8px;padding:2px 7px;margin-right:4px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#F37021;display:flex;z-index:60}
.bottom-nav button{flex:1;background:none;border:none;color:#fff;font-size:19px;padding:10px 0 9px;cursor:pointer;opacity:.85}
.bottom-nav button.active{opacity:1;background:rgba(255,255,255,.18)}
.content{padding:12px}
.card{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.14);padding:14px;margin-bottom:12px}
.card h3{font-size:14px;color:#555;margin-bottom:10px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.14);padding:12px;text-align:center}
.kpi .lb{font-size:11.5px;color:#777;min-height:28px;display:flex;align-items:center;justify-content:center}
.kpi .vl{font-size:23px;font-weight:700;color:#333;margin-top:4px}
.kpi .vl.orange{color:#F37021}
.search{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:4px;font-size:14px;background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid #F37021;color:#F37021;background:#fff;border-radius:14px;padding:5px 12px;font-size:12px;cursor:pointer}
.chip.on{background:#F37021;color:#fff}
.list-item{background:#fff;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.12);margin-bottom:9px;padding:11px 12px 11px 0;display:flex;align-items:center;cursor:pointer}
.list-item .bar{width:5px;align-self:stretch;border-radius:6px 0 0 6px;margin-right:11px;flex-shrink:0}
.li-main{flex:1;min-width:0}
.li-title{font-size:13.5px;font-weight:600;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{font-size:11.5px;color:#888;margin-top:2px}
.li-tag{font-size:10.5px;font-weight:700;border-radius:3px;padding:2px 6px;color:#fff;flex-shrink:0}
.li-arrow{color:#bbb;font-size:16px;margin-left:8px;flex-shrink:0}
.fab{position:fixed;bottom:72px;right:calc(50% - 240px + 14px);max-width:464px;background:#F37021;color:#fff;border:none;border-radius:50%;width:52px;height:52px;font-size:24px;box-shadow:0 3px 8px rgba(0,0,0,.35);cursor:pointer;z-index:55}
@media (max-width:480px){.fab{right:14px}}
.btn{background:#F37021;color:#fff;border:none;border-radius:4px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;width:100%;text-transform:uppercase}
.btn.gray{background:#9e9e9e}
.btn.green{background:#43a047}
.btn.outline{background:#fff;color:#F37021;border:1px solid #F37021}
.btn-row{display:flex;gap:10px}
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:2px solid #eee;position:sticky;top:106px;z-index:40;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:11px 13px;font-size:12px;color:#777;cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:#F37021;border-bottom-color:#F37021;font-weight:700}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11px;font-weight:700;color:#888;text-transform:uppercase;margin-bottom:4px;letter-spacing:.3px}
.fld input,.fld select,.fld textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;font-size:14px;background:#fff}
.fld input[readonly]{background:#eee;color:#666}
.fld-row{display:flex;gap:10px}
.fld-row .fld{flex:1}
.qr-ico{float:right;background:none;border:1px solid #F37021;color:#F37021;border-radius:4px;font-size:16px;padding:5px 9px;cursor:pointer;margin-left:6px}
.pend-opt{display:flex;align-items:center;gap:8px;margin-top:10px}
.pend-opt input[type=text]{flex:1;padding:9px;border:1px solid #ccc;border-radius:4px}
.act-btn{width:44px;height:36px;border:none;border-radius:4px;color:#fff;font-weight:700;cursor:pointer;font-size:13px}
.ok{background:#43a047}.nok{background:#e53935}.na{background:#9e9e9e}
.act-btn.on{outline:3px solid #ffca28}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.kv:last-child{border-bottom:none}
.kv b{color:#555;font-weight:600}
.kv span{text-align:right;color:#333}
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none}
.drawer-mask.open{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:270px;max-width:80vw;background:#fff;z-index:81;transform:translateX(-100%);transition:transform .25s;overflow-y:auto}
.drawer.open{transform:translateX(0)}
.drawer .dhead{background:#F37021;color:#fff;padding:18px 16px}
.drawer .dhead .avatar{width:52px;height:52px;border-radius:50%;background:#fff;color:#F37021;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;margin-bottom:8px}
.drawer .dhead .nm{font-size:14px;font-weight:700}
.drawer .dhead .em{font-size:11.5px;opacity:.9}
.drawer .ditem{padding:13px 16px;font-size:13.5px;color:#444;border-bottom:1px solid #f2f2f2;cursor:pointer;display:flex;gap:10px;align-items:center}
.drawer .ditem.on{background:#fdeadd;color:#F37021;font-weight:700}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:11px 18px;border-radius:22px;font-size:13px;opacity:0;transition:.3s;z-index:99;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.center-screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:26px;background:linear-gradient(160deg,#f9772b,#e05e12)}
.center-screen .card{margin-bottom:14px}
.login-logo{display:block;margin:0 auto 22px;max-width:190px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.banner-img{width:100%;height:110px;object-fit:cover;border-radius:6px 6px 0 0}
.sync-bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-top:14px}
.sync-bar div{height:100%;background:#F37021;width:0%;transition:width .3s}
.qr-box{width:220px;height:220px;margin:24px auto;border:3px solid #F37021;border-radius:12px;position:relative;overflow:hidden;background:#222}
.qr-line{position:absolute;left:8px;right:8px;height:3px;background:#43a047;box-shadow:0 0 10px #43a047;animation:scan 1.6s linear infinite}
@keyframes scan{0%{top:8px}50%{top:calc(100% - 11px)}100%{top:8px}}
.timer-pill{background:#1e88e5;color:#fff;border-radius:16px;padding:4px 12px;font-size:12.5px;font-weight:700;position:sticky;top:100px;z-index:30;display:flex;gap:10px;align-items:center;margin:0 12px}
.note{font-size:11px;color:#999;margin-top:6px}
h4.sec{font-size:12px;color:#F37021;text-transform:uppercase;margin:14px 0 8px;letter-spacing:.5px}
.empty{text-align:center;color:#aaa;padding:34px 10px;font-size:13px}
.subtabs{display:flex;background:#fff;border-bottom:1px solid #eee;margin:-12px -12px 12px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.stab{flex:1;white-space:nowrap;text-align:center;padding:10px 12px;font-size:11.5px;font-weight:700;color:#888;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent}
.stab.on{color:#F37021;border-bottom-color:#F37021}
.req{color:#e53935;margin-left:2px}
.fld.err input,.fld.err select,.fld.err textarea{border-color:#e53935;background:#fff5f5}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;margin-bottom:10px}
.flow .p{background:#e3f2fd;border:1px solid #90caf9;border-radius:6px;padding:4px 8px}
.flow .ar{color:#999}
.header.home{background:#00734F;min-height:56px}
.header.home .icon-btn{font-size:30px;padding:8px 10px}
.header.home h1{font-size:22px;font-weight:500;margin-left:24px}
.hk-title{text-align:center;font-size:22px;color:#555;margin:10px 0 12px}
.hk-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.hk{background:#dfe0e2;text-align:center;padding:8px 6px;display:flex;flex-direction:column;justify-content:center}
.hk .lb{font-size:14px;color:#555;min-height:0;display:flex;align-items:center;justify-content:center;line-height:1.15}
.hk .vl{font-size:34px;font-weight:700;margin-top:4px;line-height:1.1}
.tbar{display:flex;align-items:center;gap:10px;background:#fff;padding:0 0 0 12px;position:sticky;top:54px;z-index:45;border-bottom:1px solid #eee;min-height:52px}
.tbar select{flex:1;min-width:0;border:none;border-bottom:1px solid #999;padding:8px 2px;font-size:13px;background:#fff;color:#555;border-radius:0}
.tbar .tm{font-size:19px;font-weight:700;min-width:64px;text-align:center;line-height:1.1}
.tbar .tm small{display:block;font-size:10px;font-weight:400;color:#777}
.tbar button{border:none;color:#fff;font-weight:700;font-size:12px;text-transform:uppercase;align-self:stretch;padding:0 18px;cursor:pointer}
.tbar .go{background:#43a047}.tbar .stop{background:#e53935}
.rec{background:#fff;border-left:5px solid #f9c900;padding:8px 36px 8px 10px;margin-bottom:2px;font-size:12.5px;line-height:1.55;position:relative}
.rec b{color:#444}
.rec .del{position:absolute;right:8px;top:8px;background:none;border:none;font-size:16px;cursor:pointer}
.total{text-align:center;font-size:12px;color:#888;background:#e6e6e6;padding:6px;margin-top:8px}
.fld .radios{display:flex;gap:18px;align-items:center;padding:6px 0}
.fld .radios label{display:flex;align-items:center;gap:6px;font-size:14px;text-transform:none;color:#444;font-weight:400;letter-spacing:0;margin:0}
.fld .radios input{width:auto}
.fld.err .radios{outline:1px solid #e53935;outline-offset:2px}

.btn[disabled]{opacity:.4;cursor:default}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dot{width:30px;height:30px;border-radius:50%;background:#ddd;color:#555;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer}
.dot.sOK{background:#43a047;color:#fff}.dot.sNOK{background:#e53935;color:#fff}.dot.sNA{background:#9e9e9e;color:#fff}
.dot.cur{outline:3px solid #F37021;outline-offset:1px}
.res-row{display:flex;gap:8px}
.res-btn{flex:1;border:none;border-radius:6px;padding:9px 4px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25;opacity:.5}
.res-btn b{font-size:15px}.res-btn small{font-size:10px}
.res-btn.ok{background:#43a047}.res-btn.nok{background:#e53935}.res-btn.na{background:#757575}
.res-btn.on{opacity:1;outline:3px solid #ffca28}
.step-lb{font-size:12px;font-weight:700;color:#F37021;margin:12px 0 6px}
.photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.thumb{width:92px;font-size:10px;color:#666;line-height:1.3;word-break:break-word}
.thumb img{width:92px;height:70px;object-fit:cover;border-radius:4px;display:block}
.photo-add{width:92px;height:70px;border:2px dashed #F37021;background:#fff7f1;color:#F37021;border-radius:4px;font-size:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.photo-add small{font-size:10px}
.pimg{width:92px;height:70px;object-fit:cover;border-radius:4px;margin-top:4px}
.fca-flow{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-weight:700;font-size:13px;color:#888}
.fca-flow span{flex:1;text-align:center;color:#fff;padding:8px 4px;border-radius:6px}
.fca-flow .r{background:#d32f2f}.fca-flow .o{background:#f57c00}.fca-flow .g{background:#2e7d32}
.help-box{background:#f3f8f4;border-left:4px solid #2e7d32;border-radius:4px;padding:9px 10px;font-size:12px;line-height:1.5;margin-bottom:11px;color:#333}
.help-box ul{margin:4px 0 0 16px}
.warn-box{background:#fdecea;border-left:4px solid #e53935;color:#b71c1c;border-radius:4px;padding:8px 10px;font-size:12px;margin:8px 0;line-height:1.45}
.gap-chip{text-align:center;font-size:11.5px;font-weight:700;color:#2e7d32;background:#e8f5e9;padding:5px;margin:2px 0}
.chk-box{background:#f7f7f7;border-radius:4px;padding:9px 10px;font-size:12px;margin-bottom:10px}
.chk{margin-top:4px;font-weight:600}.chk.yes{color:#2e7d32}.chk.no{color:#c62828}
.phase-row{display:flex;gap:6px;margin-bottom:8px}
.phase{flex:1;color:#fff;border-radius:6px;padding:7px 6px;font-size:11px;line-height:1.3}
.phase b{display:block;font-size:12.5px}
.ph-Antes{background:#d32f2f}.ph-Durante{background:#f9a825}.ph-Depois{background:#2e7d32}
details.guide{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.14);padding:10px 12px;margin-bottom:12px;font-size:12.5px}
details.guide summary{font-weight:700;color:#2e7d32;cursor:pointer}
details.guide p{margin-top:8px;line-height:1.5}
</style>

function getGeo(cb){if(!navigator.geolocation){cb(null);return;}

function pickPhoto(cb){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('capture','environment');
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{const im=new Image();
      im.onload=()=>{const k=Math.min(1,160/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);const th=c.toDataURL('image/jpeg',.6);
        getGeo(g=>cb({nome:f.name,thumb:th,data:new Date().toLocaleString('pt-BR'),geo:g}));};
      im.onerror=()=>toast('Imagem inválida');im.src=r.result;};
    r.readAsDataURL(f);};
  inp.click();}

/* ---------- fila de sincronismo ---------- */
function queue(action){
  if(DB.online){toast('Sincronizado com o Manusis Web ✓');}
  else{DB.queue.push({t:Date.now(),...action});saveDB();toast('Off-line: ação na fila ('+DB.queue.length+')');updateBadges();}
}
function toggleOnline(){
  DB.online=!DB.online;saveDB();
  if(DB.online){drainQueue();}else{toast('Modo OFF-LINE ativado');}
  updateBadges();render();
}
function drainQueue(){
  const n=DB.queue.length;if(!n){return;}
  toast('Sincronizando '+n+' ação(ões)...');let i=0;
  const iv=setInterval(()=>{i++;if(i>=n){clearInterval(iv);DB.queue=[];saveDB();toast('Sincronismo concluído ✓');updateBadges();render();}},700);
}
function updateBadges(){
  const b=document.getElementById('queueBadge');
  if(b){ if(!DB.online&&DB.queue.length){b.style.display='';b.textContent=DB.queue.length;} else b.style.display='none';}
  const ob=document.getElementById('offBadge');if(ob)ob.style.display=DB.online?'none':'';
}
/* ---------- apontamento de tempo ---------- */
function restoreTimer(){TIMER=DB.timer||null;}
function timerStart(omNum,tipo){TIMER={om:omNum,tipo,start:Date.now()};DB.timer=TIMER;saveDB();startTicker();toast('Apontamento "'+tipo+'" iniciado');render();}
function timerStop(){if(!TIMER)return;const h=(Date.now()-TIMER.start)/3600000;
  const om=DB.oms.find(o=>o.num===TIMER.om);
  if(om)om.apont.push({mant:DB.user?DB.user.nome:USER_DEMO.nome,tipo:TIMER.tipo,ini:TIMER.start,fim:Date.now(),h:Math.round(h*100)/100});
  TIMER=null;DB.timer=null;saveDB();stopTicker();
  queue({t:'apont',om:om?om.num:''});toast('Apontamento registrado: '+fmtH(h));render();}
function startTicker(){stopTicker();TIMER_IV=setInterval(()=>{const e=document.getElementById('timerTxt');if(e&&TIMER)e.textContent=fmtClock(Date.now()-TIMER.start);},1000);}
function stopTicker(){if(TIMER_IV){clearInterval(TIMER_IV);TIMER_IV=null;}}
/* ---------- helpers ---------- */
function fmtClock(ms){const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),mi=Math.floor(t%3600/60),se=t%60,z=n=>String(n).padStart(2,'0');return h?h+':'+z(mi)+':'+z(se):z(mi)+':'+z(se);}
function timerBtn(n){const t=document.getElementById('aptTipo');const v=t?t.value:'';if(!v){toast('Selecione o tipo de apontamento');return;}if(TIMER&&TIMER.om!==n){toast('Já existe apontamento em andamento na '+TIMER.om);return;}timerStart(n,v);}
function fmtH(n){return (n||0).toFixed(2).replace('.',',')+'h'}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function nowBR(){const d=new Date();return d.toLocaleDateString('pt-BR')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function ativo(id){return DB.ativos.find(a=>a.id===id)||DB.ativos[0]}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),350)},2700);}
/* ---------- roteador ---------- */
function go(r){location.hash=r}
function route(){const h=(location.hash||'#home').slice(1);const q=h.indexOf('?');return {r:q<0?h:h.slice(0,q),p:new URLSearchParams(q<0?'':h.slice(q+1))};}
function requireBoot(){
  const {r}=route();
  if(!DB.activated&&r!=='activate')return '#activate';
  if(DB.activated&&!DB.user&&!['login','sync','activate'].includes(r))return '#login';
  return null;
}
function render(){
  const red=requireBoot();if(red){if(location.hash!==red){location.replace(red);}return;}
  const {r,p}=route();stopTicker();
  const fns={activate:scActivate,login:scLogin,sync:scSync,home:scHome,minhas:scMinhas,om:scOM,listaoms:scListaOMs,listacorr:scListaCorr,listasss:scListaSSs,
    novaom:scNovaOM,novass:scNovaSS,hisom:scHisOM,hisss:scHisSS,docs:scDocs,qr:scQR,aprov:scAprov};
  const f=fns[r]||scHome;
  document.getElementById('app').innerHTML=f(p);
  const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=(f===scHome)?'#00382A':'#F37021';
  const nav=document.getElementById('bnav');
  if(nav){const cls={home:'home',minhas:'minhas',om:'minhas',novaom:'nova',novass:'nova',listaoms:'lista',listasss:'lista',menu:'menu'};
    const btns=nav.querySelectorAll('button');const cur=cls[r]||'';
    btns.forEach(b=>{if(b.dataset.k===cur)b.classList.add('active');});
  }
  if(r==='sync')startSync();if(r==='om'||r==='minhas'&&TIMER)startTicker();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
/* ---------- inicialização ---------- */
function boot(){
  loadDB();restoreTimer();
  if(!location.hash)location.replace('#'+(DB.activated?(DB.user?'home':'login'):'activate'));
  render();
}</script>

function filterList(q,id){

function chipFilter(chip,id){
  chip.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));chip.classList.add('on');
  const f=chip.dataset.f,el=document.getElementById(id);
  el.querySelectorAll('.list-item').forEach(it=>{
    const ok=f==='Todas'||it.querySelector('.li-tag').textContent===f;
    it.style.display=ok?'':'none';});
}

      const rows=o.apont.map((a,i)=>({a,i})).sort((x,y)=>y.a.ini-x.a.ini);
      return bar+`${rows.map(({a,i})=>`<div class="rec"><b>Mantenedor:</b> ${esc(a.mant)}<br><b>Tipo de apontamento:</b> ${esc(String(a.tipo).toUpperCase())}<br><b>Data de início:</b> ${stamp(a.ini)}<br><b>Data de fim:</b> ${stamp(a.fim)}<br><b>Tempo:</b> ${fmtH(a.h)}<button class="del" onclick="delMO('${o.num}',${i})" aria-label="Excluir">🗑</button></div>`).join('')||'<div class="empty">Nenhum apontamento</div>'}

        if(k>0){const gap=x.a-L[k-1].b;

        rows+=`<div class="rec"><b>Início:</b> ${esc(pd.ini)}<br><b>Fim:</b> ${esc(pd.fim)}<br><b>Duração:</b> ${fmtDur(x.b-x.a)}<br><b>Impacto no processo:</b> ${esc(pd.impacto)}${pd.tipo?`<br><b>Tipo de parada:</b> ${esc(pd.tipo)}<br><b>Estratificar parada:</b> ${esc(pd.estr)}<br><b>Acionado ativo reserva:</b> ${esc(pd.reserva)}`:''}</div>`;});
      return guide+`<div class="card"><div class="kv"><b>Registros de parada</b><span>${L.length}</span></div><div class="kv"><b>Tempo total parado</b><span>${L.length?fmtDur(tot):'—'}</span></div></div>

    fca:()=>{

        <div class="step-lb">3 · Selecione a ação primária</div>

        <div class="fld" id="f_fcaDescA"><label>Descrição da ação</label><textarea id="fcaDescA" rows="2" placeholder="Detalhe a correção e o resultado">${esc(f.descA)}</textarea></div>
        <p class="note">Seleção padronizada + descrição técnica = registro completo. O FCA é a base para a descrição final do serviço no fechamento.</p>
        <div class="btn-row" style="margin-top:10px"><button class="btn gray" onclick="go('#om?n=${encodeURIComponent(o.num)}&t=manut')">Cancelar</button><button class="btn" onclick="salvarFCA('${o.num}')">Salvar</button></div></div>`;
    },
    pex:()=>`<div class="card">${o.pendAnex.map(pd=>`<div class="kv"><b>${esc(pd.desc)}</b><span>${esc(pd.cat)} · ${pd.data}</span></div>`).join('')||'<div class="empty">Nenhuma pendência anexada pela PPCM</div>'}</div>`,
    pend:()=>{
      if(PEND_IMG&&PEND_IMG.om!==o.num)PEND_IMG=null;
      const catC=c=>(PEND_CATS.find(x=>x[0]===c)||['','#999'])[1];
      const list=o.pend.map(pd=>`<div class="rec" style="border-left-color:${catC(pd.cat)}"><b style="color:${catC(pd.cat)}">● ${esc(pd.cat)}</b><br>${pd.esp?`<b>Especialidade:</b> ${esc(pd.esp)}<br>`:''}${pd.hh!=null&&pd.hh!==''?`<b>HH previsto:</b> ${esc(pd.hh)}h<br>`:''}${esc(pd.desc)}${pd.img?`<br><img class="pimg" src="${pd.img.thumb}" alt="">`:''}</div>`).join('')||'<div class="empty">Nenhuma pendência registrada</div>';
      return `<div class="help-box"><b>O que é uma pendência?</b><br>Toda condição identificada e não tratada deve gerar uma pendência, para garantir controle, planejamento e rastreabilidade da manutenção.</div>
      ${list}
      <div class="card" style="margin-top:12px"><h3>Registrar pendência</h3>

        <div class="fld" id="f_pendHH"><label>HH previsto (horas)</label><input id="pendHH" type="number" min="0" step="0.5" inputmode="decimal" placeholder="Ex.: 1"></div>

        <div class="fld" id="f_pendCat"><label>Categoria</label><select id="pendCat">${optList(PEND_CATS.map(x=>x[0]),'')}</select></div>
        <div class="fld"><label>Imagem</label><div class="photo-grid" id="pendImgBox">${PEND_IMG?fotoThumb(PEND_IMG):''}<button class="photo-add" onclick="pendFoto('${o.num}')">📷<small>Anexar foto</small></button></div></div>

        <div class="photo-grid">${o.fotos.map(f=>fotoThumb(f)).join('')}</div>
        <div class="fld" id="f_fotoFase"><label>Fase</label><select id="fotoFase">${optList(FOTO_FASES,'')}</select></div>
        <div class="fld"><label>Descrição</label><input id="fotoDesc" placeholder="Ex.: CFTV 01 - Fonte com falha"></div>
        <button class="btn" onclick="addFotoOM('${o.num}')">📷 Anexar foto</button>

      <div class="card"><h3>Documentos do ativo e anexos</h3>${ativo(o.ativo).docs.concat(o.docs).map(d=>`<div class="kv"><b>📄 ${esc(d.nome)}</b><span>${d.tipo} · ${d.tam}</span></div>`).join('')}</div>
      <div class="card"><h3>Anexar</h3>
        <div class="fld"><label>Nome do arquivo</label><input id="docNome" placeholder="Ex.: Foto após serviço"></div>

        <button class="btn" style="margin-top:10px" onclick="addDoc('${o.num}')">Salvar</button></div>`;
    },
    aprovtab:()=>`<div class="card">${o.aprov.map(a=>`<div class="kv"><b>${esc(a.nome)}</b><span>${esc(a.papel)}</span></div>`).join('')||'<div class="empty">Esta OM não possui aprovadores definidos (configuração no Manusis Web).</div>'}</div>`,
    fecha:()=>{
      const f=o.fca,fc=o.tipo==='Corretiva';
      const chk=(ok,tx)=>`<div class="chk ${ok?'yes':'no'}">${ok?'✔':'✖'} ${tx}</div>`;
      return `<div class="card"><h3>Fechamento da OM ${o.tipo}</h3>
        ${fc?`<div class="help-box"><b>Falha → Causa → Ação</b><br>${f.salvo?esc(f.tipo)+' · '+esc(f.causa)+' · '+esc(f.acao):'FCA ainda não preenchido. Preencha na aba “Falha, causa e ação”.'}</div>`:''}
        <div class="fld" id="f_fechaServ"><label>${fc?'Serviço executado':'Serviços executados'}</label><textarea id="fechaServ" rows="${fc?7:4}" placeholder="Descreva as ações durante a execução da OM">${esc(o.fecha.servicos)}</textarea></div>
        ${fc?`<button class="btn outline" style="margin-bottom:10px" onclick="comporFCA('${o.num}')">Compor a partir do FCA</button>
        <div class="fld" id="f_fechaMat"><label>Materiais utilizados</label><textarea id="fechaMat" rows="2" placeholder="Itens e quantidades. Ex.: cabo de alimentação 12 V (2 m), 2 conectores. Se não houve: Nenhum">${esc(o.fecha.materiais)}</textarea></div>
        <div class="chk-box"><b>Registro completo</b> = condição encontrada + causa identificada + resultado + materiais
          ${chk(!!(f.salvo&&f.descF),'Condição encontrada (falha)')}${chk(!!(f.salvo&&f.descC),'Causa identificada')}${chk(!!(f.salvo&&f.descA),'Ação e resultado')}${chk(!!o.fecha.materiais,'Materiais utilizados')}</div>
        <div class="warn-box"><b>Evite:</b> “Equipamento ajustado e normalizado.” Não esclarece a falha, a causa nem o serviço executado.</div>`:''}
        <button class="btn" onclick="salvarFechamento('${o.num}')">Salvar</button>
        <button class="btn green" style="margin-top:8px" onclick="concluirOM('${o.num}')">${o.aprov.length?'Enviar para aprovação':'Concluído'}</button>
        <p class="note">Reconhecimento de fala do Android pode ser usado para preencher as descrições.</p></div>`;
    }
  };
  const tbar=`<div class="tbar">${running?`<div style="flex:1;font-size:13px;color:#555;font-weight:600">${esc(TIMER.tipo)}</div>`:`<select id="aptTipo"><option value="">Tipo de apontamento</option>${APONT_TYPES.map(t=>`<option>${t}</option>`).join('')}</select>`}<div class="tm"><span id="timerTxt">${fmtClock(running?Date.now()-TIMER.start:0)}</span>${running?`<small>${o.num}</small>`:''}</div>${running?`<button class="stop" onclick="timerStop()">Parar</button>`:`<button class="go" onclick="timerBtn('${o.num}')">Iniciar</button>`}</div>`;
  return shell(o.num,`${tbar}<div class="tabs">${OM_TABS.filter(t=>t[0]!=='fca'||o.tipo==='Corretiva').map(t=>`<div class="tab ${tab===t[0]?'on':''}" onclick="go('#om?n=${encodeURIComponent(o.num)}&t=${t[0]}')">${t[1]}</div>`).join('')}</div>
    <div class="content">${(body[tab]||body.manut)()}</div>`);

function navAtv(i){const o=findOM(route().p.get('n'));if(i<0||i>=o.atvs.length)return;go(`#om?n=${encodeURIComponent(o.num)}&t=atvs&i=${i}`);}
function setAtv(i,st){const o=findOM(route().p.get('n'));o.atvs[i].st=st;saveDB();render();}
function saveNokPend(i){const o=findOM(route().p.get('n'));const v=document.getElementById('pendNok'+i).value.trim();
  if(!v){toast('Registre a pendência obrigatória do NOK');return;}
  o.pend.push({desc:v,cat:'Item identificado como NÃO OK',esp:'',hh:'',data:new Date().toLocaleDateString('pt-BR')});o.atvs[i].nokPend=true;saveDB();toast('Pendência registrada na Carteira');render();}
function addFotoAtv(i){const o=findOM(route().p.get('n'));pickPhoto(f=>{f.fase='Atividade '+o.atvs[i].n;o.atvs[i].fotos.push(f);saveDB();toast(f.geo?'Foto anexada com localização ✓':'Foto anexada, sem localização (ative o GPS)');render();});}
function saveAtvs(n){const o=findOM(n);if(o.atvs.some(a=>a.st==='NOK'&&!a.nokPend)){toast('Toda atividade NOK exige pendência registrada');return;}
  if(!o.atvs.every(a=>a.st)){toast('Aponte todas as atividades antes de salvar');return;}
  const sem=o.atvs.filter(a=>!(a.fotos&&a.fotos.length)).length;
  if(sem&&!confirm(sem+' atividade(s) sem foto de evidência. As fotos da verificação e da execução comprovam o serviço. Salvar mesmo assim?'))return;
  queue({t:'atvs',om:n});toast('Atividades salvas ✓');go('#home');}
function markErr(list){let first=null;list.forEach(([id,bad,l])=>{const b=document.getElementById('f_'+id);if(b)b.classList.toggle('err',!!bad);if(bad&&!first)first=[id,l];});
  if(first){toast('Preencha: '+first[1]);const b=document.getElementById('f_'+first[0]);if(b)b.scrollIntoView({behavior:'smooth',block:'center'});}return first;}
function addManualMO(n){const o=findOM(n);const g=k=>document.getElementById(k).value.trim();
  if(markErr([['moMant',!g('moMant'),'Mantenedor'],['moTipo',!g('moTipo'),'Tipo de apontamento'],['moIni',!g('moIni'),'Data de início'],['moFim',!g('moFim'),'Data de fim']]))return;
  const i=new Date(g('moIni')).getTime(),f=new Date(g('moFim')).getTime();
  if(!(f>i)){toast('Data de fim deve ser após o início');return;}
  o.apont.push({mant:g('moMant'),tipo:g('moTipo'),ini:i,fim:f,h:Math.round((f-i)/3600000*100)/100});
  saveDB();queue({t:'mo',om:n});toast('Apontamento salvo ✓');go('#om?n='+encodeURIComponent(n)+'&t=mo&s=realizada');}
function delMO(n,i){const o=findOM(n);if(!confirm('Excluir este apontamento?'))return;o.apont.splice(i,1);saveDB();queue({t:'mo',om:n});toast('Apontamento excluído');render();}
function addParada(n){const o=findOM(n);const g=k=>document.getElementById(k).value;const r=nm=>{const e=document.querySelector('input[name='+nm+']:checked');return e?e.value:'';};
  const v={ini:g('parIni'),fim:g('parFim'),imp:r('parImp'),tipo:r('parTipo'),estr:r('parEstr'),res:r('parRes')};
  if(markErr([['parIni',!v.ini,'Data de início'],['parFim',!v.fim,'Data de fim'],['parImp',!v.imp,'Impacto no processo'],['parTipo',!v.tipo,'Tipo de parada'],['parEstr',!v.estr,'Estratificar parada'],['parRes',!v.res,'Acionado ativo reserva']]))return;
  const A=parDT(v.ini),B=parDT(v.fim);
  if(!(B>A)){toast('Data de fim deve ser após o início');return;}
  const ov=o.paradas.find(pd=>A<parDT(pd.fim)&&B>parDT(pd.ini));
  if(ov){toast('Período sobrepõe uma parada já registrada ('+ov.ini+' → '+ov.fim+')');return;}
  const adj=o.paradas.find(pd=>A===parDT(pd.fim)||B===parDT(pd.ini));
  if(adj&&!confirm('Não há retorno operacional entre esta parada e outra já registrada. Se a máquina não voltou a operar, registre uma única parada contínua. Salvar mesmo assim?'))return;
  o.paradas.push({ini:v.ini.replace('T',' '),fim:v.fim.replace('T',' '),impacto:v.imp,tipo:v.tipo,estr:v.estr,reserva:v.res});
  saveDB();queue({t:'parada',om:n});toast('Parada registrada ✓');go('#om?n='+encodeURIComponent(n)+'&t=parada');}
function salvarFCA(n){const o=findOM(n);const g=k=>document.getElementById(k).value.trim();
  if(markErr([['fcaTipo',!g('fcaTipo'),'Tipo de falha'],['fcaDescF',!g('fcaDescF'),'Descrição da falha'],['fcaCausa',!g('fcaCausa'),'Causa'],['fcaDescC',!g('fcaDescC'),'Descrição da causa'],['fcaAcao',!g('fcaAcao'),'Ação primária'],['fcaDescA',!g('fcaDescA'),'Descrição da ação']]))return;
  o.fca={tipo:g('fcaTipo'),descF:g('fcaDescF'),causa:g('fcaCausa'),descC:g('fcaDescC'),acao:g('fcaAcao'),descA:g('fcaDescA'),salvo:true};
  o.fecha.falha=o.fca.tipo;o.fecha.causa=o.fca.causa;o.fecha.acao=o.fca.acao;
  saveDB();queue({t:'fca',om:n});toast('FCA salvo ✓ Use-o para compor o fechamento');render();}
function pendFoto(n){pickPhoto(f=>{f.om=n;f.fase='Pendência';PEND_IMG=f;const b=document.getElementById('pendImgBox');if(b)b.innerHTML=fotoThumb(f)+'<button class="photo-add" onclick="pendFoto(\''+n+'\')">📷<small>Trocar</small></button>';toast(f.geo?'Imagem anexada com localização ✓':'Imagem anexada, sem localização');});}
function addPend(n){const o=findOM(n);const g=k=>document.getElementById(k).value.trim();
  if(markErr([['pendEsp',!g('pendEsp'),'Especialidade'],['pendHH',g('pendHH')===''||+g('pendHH')<0,'HH previsto'],['pendDesc',!g('pendDesc'),'Descrição'],['pendCat',!g('pendCat'),'Categoria']]))return;
  o.pend.push({desc:g('pendDesc'),cat:g('pendCat'),esp:g('pendEsp'),hh:g('pendHH'),img:(PEND_IMG&&PEND_IMG.om===n)?PEND_IMG:null,data:new Date().toLocaleDateString('pt-BR')});
  PEND_IMG=null;saveDB();queue({t:'pend',om:n});toast('Pendência salva na Carteira ✓');render();}
function addFotoOM(n){const o=findOM(n);const fase=document.getElementById('fotoFase').value,desc=document.getElementById('fotoDesc').value.trim();
  if(markErr([['fotoFase',!fase,'Fase da foto']]))return;
  pickPhoto(f=>{f.fase=fase;f.desc=desc;o.fotos.push(f);saveDB();queue({t:'doc',om:n});toast(f.geo?'Foto georreferenciada anexada ✓':'Foto anexada, sem localização (ative o GPS)');render();});}
function addDoc(n){const o=findOM(n);const v=document.getElementById('docNome').value.trim();if(!v){toast('Informe o nome do arquivo');return;}
  o.docs.push({nome:v,tipo:'Imagem',tam:'780 KB'});saveDB();queue({t:'doc',om:n});toast('Documento anexado ✓');render();}
function mockAnexo(m){toast(m+' — captura simulada na demo');}
function comporFCA(n){const o=findOM(n),f=o.fca;if(!f.salvo){toast('Preencha e salve o FCA antes de compor');go('#om?n='+encodeURIComponent(n)+'&t=fca');return;}
  const mat=(document.getElementById('fechaMat').value||'').trim();
  document.getElementById('fechaServ').value=f.tipo+': '+f.descF+'\n'+f.causa+': '+f.descC+'\n'+f.acao+': '+f.descA+(mat?'\nMateriais utilizados: '+mat:'');
  toast('Descrição composta a partir do FCA');}
function salvarFechamento(n){const o=findOM(n);const s=document.getElementById('fechaServ').value.trim();
  if(o.tipo==='Corretiva'){const m=document.getElementById('fechaMat').value.trim();
    if(markErr([['fechaServ',!s,'Serviço executado'],['fechaMat',!m,'Materiais utilizados']]))return;
    if(!o.fca.salvo){toast('Preencha o FCA (falha, causa e ação) antes de salvar o fechamento');go('#om?n='+encodeURIComponent(n)+'&t=fca');return;}
    o.fecha.materiais=m;o.fecha.falha=o.fca.tipo;o.fecha.causa=o.fca.causa;o.fecha.acao=o.fca.acao;}
  else if(!s){toast('Descreva os serviços executados');return;}
  o.fecha.servicos=s;o.fecha.salvo=true;saveDB();queue({t:'fecha',om:n});toast('Fechamento salvo ✓');render();}
function concluirOM(n){const o=findOM(n);if(!o.fecha.salvo){toast('Salve o fechamento antes de concluir');return;}
  if(o.tipo==='Corretiva'){const falta=['Antes','Depois'].filter(f=>!o.fotos.some(x=>x.fase===f));
    if(falta.length){toast('Anexe a foto de: '+falta.join(' e ')+' (aba Documentos)');go('#om?n='+encodeURIComponent(n)+'&t=docs');return;}}
  o.status=o.aprov.length?'Aguardando aprovação':'Concluída';saveDB();queue({t:'concluir',om:n});
  toast(o.aprov.length?'OM enviada para aprovação':'OM concluída — sai do Mobile e vai para Apontamento Concluído no Web ✓');go('#home');}
/* ---- VI. Nova OM ---- */
function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function localDT(ms){const d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function optList(arr,sel){return '<option value="">Selecione</option>'+arr.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');}
function scNovaOM(p){
  const viaQR=p.get('qr')==='1';
  const pre=viaQR?ativo('INJ-072'):null;
  const u=DB.user||USER_DEMO;
  const hoje=localDate();
  const UN=['Curitiba','Joinville'],L1=['Planta Injeção','Planta Estamparia','Casa de Máquinas','Planta Caldeiraria'],
        L2=['Setor 01','Setor 02','Setor 04','Setor 10'],L3=['Linha 1','Linha 2','Linha 3'];
  return shell('Nova OM',`<div class="content">

    <h4 class="sec" style="margin-top:4px">Localização e identificação</h4>

      <div class="fld"><label>Empresa</label><input value="${esc(u.empresa)}" readonly></div>

      <div class="fld" id="f_omL1"><label>Localização 1<span class="req">*</span></label><select id="omL1">${optList(L1,pre&&pre.l1)}</select></div>
      <div class="fld" id="f_omL2"><label>Localização 2<span class="req">*</span></label><select id="omL2">${optList(L2,pre&&pre.l2)}</select></div>
      <div class="fld" id="f_omL3"><label>Localização 3<span class="req">*</span></label><select id="omL3">${optList(L3,pre?'Linha 1':'')}</select></div>
      <div class="fld" id="f_omAtivo"><label>Ativo<span class="req">*</span></label><select id="omAtivo" onchange="syncAtivoSel()"><option value="">Selecione</option>${DB.ativos.map(a=>`<option value="${a.id}" ${pre&&pre.id===a.id?'selected':''}>${a.id} · ${esc(a.nome)}</option>`).join('')}</select></div>
      <div class="fld"><label>Conjunto</label><select id="omConj"><option value="">Selecione</option><option>Unidade de fechamento</option><option>Unidade de injeção</option><option>Sistema hidráulico</option></select></div>
      <div class="fld"><label>Posição</label><select id="omPos"><option value="">Selecione</option><option>Posição 01</option><option>Posição 02</option></select></div>
      <div class="fld"><label>Subposição</label><select id="omSub"><option value="">Selecione</option><option>Subposição A</option><option>Subposição B</option></select></div>
      <div class="fld"><label>Componente</label><select id="omComp"><option value="">Selecione</option><option>Válvula</option><option>Cilindro</option><option>Motor elétrico</option></select></div>
    </div>
    <h4 class="sec">Identificação e datas</h4>
    <div class="card">
      <div class="fld"><label>Documento de origem</label><input id="omOrigem" placeholder="Ex.: SS 00231"></div>
      <div class="fld" id="f_omPri"><label>Prioridade<span class="req">*</span></label><select id="omPri">${optList(PRIORIDADES,'')}</select></div>
      <div class="fld-row"><div class="fld" id="f_omAb"><label>Data de abertura<span class="req">*</span></label><input id="omAb" type="date" value="${hoje}"></div>
      <div class="fld"><label>Data prevista p/ entrega</label><input id="omPrev" type="date"></div></div>
      <div class="fld-row"><div class="fld" id="f_omProg"><label>Início da programação<span class="req">*</span></label><input id="omProg" type="date" value="${hoje}"></div>
      <div class="fld"><label>Fim da programação</label><input id="omProgFim" type="date"></div></div>
    </div>
    <h4 class="sec">Serviço e responsáveis</h4>
    <div class="card">
      <div class="fld" id="f_omTipo"><label>Tipo de manutenção<span class="req">*</span></label><select id="omTipo">${optList(TIPOS_MANUT,'')}</select></div>
      <div class="fld"><label>Natureza do serviço</label><input id="omNat" placeholder="Ex.: Corretiva mecânica"></div>
      <div class="fld" id="f_omDesc"><label>Descrição<span class="req">*</span></label><textarea id="omDesc" rows="3" placeholder="Descreva o serviço"></textarea></div>
      <div class="fld" id="f_omEq"><label>Equipe do mantenedor responsável<span class="req">*</span></label><select id="omEq">${optList(['Mecânica A','Mecânica B','Elétrica','Lubrificação'],'')}</select></div>
      <div class="fld"><label>Mantenedor responsável</label><select id="omMant"><option>${esc(u.nome)}</option><option>Maria Lima</option><option>João Pereira</option></select></div>
      <div class="fld" id="f_omEqOp"><label>Equipe do operador responsável<span class="req">*</span></label><select id="omEqOp">${optList(['Operação Turno A','Operação Turno B'],'')}</select></div>
      <div class="fld"><label>Operador responsável</label><select id="omOper"><option value="">Selecione</option><option>João Pereira</option></select></div>
      <div class="btn-row"><button class="btn gray" onclick="render()">Limpar</button><button class="btn" onclick="salvarNovaOM()">Salvar</button></div>
      <p class="note"><span class="req">*</span> Campos obrigatórios</p>
    </div></div>`);
}
function syncAtivoSel(){
  const id=document.getElementById('omAtivo').value;if(!id)return;const a=ativo(id);
  const set=(k,v)=>{const e=document.getElementById(k);if(e&&[...e.options].some(o=>o.value===v||o.text===v))e.value=v;};
  set('omUn',a.un);set('omL1',a.l1);set('omL2',a.l2);
}
function salvarNovaOM(){
  const g=k=>document.getElementById(k).value;
  const req=[['omUn','Unidade'],['omL1','Localização 1'],['omL2','Localização 2'],['omL3','Localização 3'],['omAtivo','Ativo'],
    ['omPri','Prioridade'],['omAb','Data de abertura'],['omProg','Início da programação'],['omTipo','Tipo de manutenção'],
    ['omDesc','Descrição'],['omEq','Equipe do mantenedor'],['omEqOp','Equipe do operador']];
  let first=null;
  req.forEach(([k,l])=>{const box=document.getElementById('f_'+k);const bad=!g(k).trim();if(box)box.classList.toggle('err',bad);if(bad&&!first)first=[k,l];});
  if(first){toast('Preencha: '+first[1]);const b=document.getElementById('f_'+first[0]);if(b)b.scrollIntoView({behavior:'smooth',block:'center'});return;}
  const num='OM '+String(DB.nextOM++).padStart(5,'0');
  DB.oms.unshift({num,tipo:g('omTipo'),ativo:g('omAtivo'),desc:g('omDesc').trim(),prioridade:g('omPri'),
    status:'Aberta',abertura:g('omAb')+' '+nowBR().slice(-5),programada:g('omProg'),progFim:g('omProgFim')||'-',prevista:g('omPrev')||'-',
    un:g('omUn'),l1:g('omL1'),l2:g('omL2'),l3:g('omL3'),conj:g('omConj')||'-',pos:g('omPos')||'-',sub:g('omSub')||'-',comp:g('omComp')||'-',
    mant:g('omMant'),equipe:g('omEq'),oper:g('omOper')||'-',eqOper:g('omEqOp'),
    origem:g('omOrigem')||'Manual',natureza:g('omNat')||'-',
    atvs:[],moprev:[],recs:[],mats:[],apont:[],paradas:[],pendAnex:[],pend:[],docs:[],aprov:[],fecha:{servicos:'',falha:'',causa:'',acao:'',salvo:false}});
  saveDB();queue({t:'novaOM',om:num});toast(num+' criada ✓');go('#minhas');
}
/* ---- VII. Nova SS ---- */
function scNovaSS(p){
  const viaQR=p.get('qr')==='1';
  return shell('Nova SS',`<div class="content">
    <button class="qr-ico" onclick="go('#qr?to=novass')">🔳 QR Code</button>
    <div class="card">
      <div class="fld"><label>Empresa</label><input value="${esc((DB.user||USER_DEMO).empresa)}" readonly></div>
      <div class="fld"><label>Unidade</label><select><option>Curitiba</option><option>Joinville</option></select></div>
      <div class="fld"><label>Localização 1</label><select id="ssL1"><option>Planta Injeção</option><option>Planta Estamparia</option><option>Casa de Máquinas</option><option>Planta Caldeiraria</option></select></div>
      <div class="fld"><label>Localização 2</label><select><option>Setor 02</option><option>Setor 04</option><option>Setor 10</option><option>Setor 01</option></select></div>
      <div class="fld"><label>Ativo</label><select id="ssAtivo">${DB.ativos.map(a=>`<option value="${a.id}">${a.id} · ${esc(a.nome)}</option>`).join('')}</select></div>
      <div class="fld"><label>Máquina parada?</label><select id="ssParada"><option>NÃO</option><option>SIM</option></select></div>
      ${viaQR?'<p class="note" style="color:#43a047">✓ Campos preenchidos automaticamente pela leitura do QR Code do ativo.</p>':''}
    </div>
    <div class="card">
      <div class="fld"><label>Solicitante</label><input id="ssSol" value="${esc((DB.user||USER_DEMO).nome)}"></div>
      <div class="fld"><label>Assunto</label><input id="ssAss" placeholder="Resumo do problema"></div>
      <div class="fld"><label>Descrição da solicitação</label><textarea id="ssDesc" rows="4" placeholder="Descreva o problema ou necessidade"></textarea></div>
      <div class="fld"><label>Classificação</label><select id="ssClasse"><option>Corretiva</option><option>Preventiva</option><option>Preditiva</option><option>Melhoria</option><option>Serviço geral</option></select></div>
      <button class="btn" onclick="salvarNovaSS()">Salvar</button></div></div>`);
}
function salvarNovaSS(){
  const d=document.getElementById('ssDesc').value.trim(),a=document.getElementById('ssAss').value.trim();
  if(!d||!a){toast('Preencha assunto e descrição');return;}
  const num='SS '+String(DB.nextSS++).padStart(5,'0');
  DB.sss.unshift({num,desc:d,ativo:document.getElementById('ssAtivo').value,status:'Nova',abertura:nowBR(),
    solicitante:document.getElementById('ssSol').value||'-',maqParada:document.getElementById('ssParada').value,assunto:a,classe:document.getElementById('ssClasse').value});
  saveDB();queue({t:'novaSS',ss:num});toast(num+' criada ✓');go('#listasss');
}
/* ---- VIII/IX. Históricos ---- */
function scHisOM(){
  return shell('Histórico de OM',`<div class="content">
    <div class="card"><h3>Buscar por ativo</h3>
      <button class="btn outline" style="margin-bottom:12px" onclick="go('#qr?to=hisom')">🔳 Ler QR Code do ativo</button>
      <div class="fld"><label>Unidade</label><select id="hUn"><option>Curitiba</option><option>Joinville</option></select></div>
      <div class="fld"><label>Localização 1</label><select id="hL1"><option>Planta Injeção</option><option>Planta Estamparia</option><option>Casa de Máquinas</option><option>Planta Caldeiraria</option></select></div>
      <div class="fld"><label>Ativo</label><select id="hAt">${DB.ativos.map(a=>`<option value="${a.id}">${a.id} · ${esc(a.nome)}</option>`).join('')}</select></div>
      <button class="btn" onclick="buscaHist('om')">Buscar</button>
      <p class="note">Funciona apenas com o aplicativo on-line.</p></div>
    <div id="histRes"></div></div>`);
}
function scHisSS(){
  return shell('Histórico de SS',`<div class="content">
    <div class="card"><h3>Buscar por ativo</h3>
      <button class="btn outline" style="margin-bottom:12px" onclick="go('#qr?to=hisss')">🔳 Ler QR Code do ativo</button>
      <div class="fld"><label>Ativo</label><select id="hAt2">${DB.ativos.map(a=>`<option value="${a.id}">${a.id} · ${esc(a.nome)}</option>`).join('')}</select></div>
      <button class="btn" onclick="buscaHist('ss')">Buscar</button>
      <p class="note">Funciona apenas com o aplicativo on-line.</p></div>
    <div id="histRes2"></div></div>`);
}
function buscaHist(kind){
  const id=kind==='om'?document.getElementById('hAt').value:document.getElementById('hAt2').value;
  const el=kind==='om'?document.getElementById('histRes'):document.getElementById('histRes2');
  if(!DB.online){toast('Disponível apenas on-line');return;}
  const list=kind==='om'?DB.oms.filter(o=>o.ativo===id):DB.sss.filter(s=>s.ativo===id);
  el.innerHTML=`<h4 class="sec">${list.length} registro(s) para ${id} (ordem crescente de abertura)</h4>`+
    (kind==='om'?list.map(omListItem).join(''):list.map(ssListItem).join(''));
}
/* ---- X. Documentos do ativo ---- */
function scDocs(){
  return shell('Documentos do ativo',`<div class="content">
    <div class="card"><h3>Buscar por ativo</h3>
      <button class="btn outline" style="margin-bottom:12px" onclick="go('#qr?to=docs')">🔳 Ler QR Code do ativo</button>
      <div class="fld"><label>Ativo</label><select id="dAt" onchange="renderDocsAtivo()">${DB.ativos.map(a=>`<option value="${a.id}">${a.id} · ${esc(a.nome)}</option>`).join('')}</select></div></div>
    <div id="docsRes"></div>
    <script>renderDocsAtivo()<\/script></div>`);
}
function renderDocsAtivo(){
  const sel=document.getElementById('dAt');if(!sel)return;const a=ativo(sel.value);
  const el=document.getElementById('docsRes');if(!el)return;
  if(!DB.online){el.innerHTML='<div class="empty">Disponível apenas on-line</div>';return;}
  el.innerHTML=`<div class="card"><h3>📄 Documentos de ${a.id}</h3>${a.docs.map(d=>`<div class="kv"><b>${d.tipo==='PDF'?'📄':d.tipo==='Imagem'?'🖼':'📊'} ${esc(d.nome)}</b><span>${d.tipo} · ${d.tam}</span></div>`).join('')||'<div class="empty">Nenhum documento</div>'}</div>`;
}
/* ---- Leitor QR (simulado) ---- */
function scQR(p){
  const to=p.get('to')||'novaom';
  return shell('Leitor QR Code',`<div class="content" style="text-align:center">
    <div class="qr-box"><div class="qr-line"></div></div>
    <p style="font-size:13px;color:#666;margin-bottom:14px">Aproxime o leitor e fotografe a TAG do ativo.<br><span class="note">Na demo, toque para simular a leitura do QR do ativo.</span></p>
    ${DB.ativos.map(a=>`<div class="list-item" onclick="qrOk('${a.id}','${to}')"><div class="bar" style="background:#F37021"></div><div class="li-main"><div class="li-title">QR · ${a.id}</div><div class="li-sub">${esc(a.nome)}</div></div><span class="li-arrow">›</span></div>`).join('')}</div>`);
}
function qrOk(id,to){
  toast('QR lido: '+id+' — campos preenchidos automaticamente');
  if(to==='hisom'){go('#hisom');setTimeout(()=>{document.getElementById('hAt').value=id;buscaHist('om');},80);}
  else if(to==='hisss'){go('#hisss');setTimeout(()=>{document.getElementById('hAt2').value=id;buscaHist('ss');},80);}
  else if(to==='docs'){go('#docs');setTimeout(()=>{const s=document.getElementById('dAt');if(s){s.value=id;renderDocsAtivo();}},80);}
  else go('#'+to+'?qr=1');
}</script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
boot();
</script>

</body>
</html>
